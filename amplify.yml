version: 1
applications:
  - appRoot: frontend
    backend:
      phases:
        build:
          commands:
            - cd "$CODEBUILD_SRC_DIR"
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
    frontend:
      # Build from the repository root so Amplify can use the backend and
      # frontend lockfiles while publishing only frontend/dist.
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci --prefix frontend --cache .npm --prefer-offline
        build:
          commands:
            - npm run build --prefix frontend
      artifacts:
        baseDirectory: frontend/dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - frontend/node_modules/**/*
